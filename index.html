<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>ECOS DE RAÍZ - Alquimia Sensorial Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>

    <style>
        :root {
            --primary-purple: #8A2BE2;
            --accent-cyan: #00FFFF;
            --deep-bg: #0f051a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--deep-bg);
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0a0411 100%);
            color: #e0d0ff;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .serif-text { font-family: 'Playfair Display', serif; }

        /* --- AMARI FLOTANTE (MINI VENTANA SIEMPRE VISIBLE) --- */
        #amari-assistant {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 140px;
            z-index: 9999;
            pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .amari-window {
            background: rgba(20, 10, 30, 0.85);
            backdrop-filter: blur(15px);
            border: 2px solid var(--primary-purple);
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(138, 43, 226, 0.3);
            text-align: center;
        }

        #amari-mini-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 8px;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .amari-bubble {
            font-size: 11px;
            line-height: 1.2;
            color: white;
            background: rgba(138, 43, 226, 0.2);
            padding: 5px;
            border-radius: 10px;
            margin-top: 5px;
        }

        /* --- ESTILOS DE MÓDULOS --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(138, 43, 226, 0.2);
            border-radius: 24px;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        .brain-region {
            cursor: pointer;
            transition: all 0.4s ease;
        }
        
        .brain-region:hover {
            filter: drop-shadow(0 0 10px currentColor);
            stroke-width: 5px;
        }

        /* --- BOTONES Y CONTROLES TOUCH --- */
        .element-btn {
            touch-action: manipulation;
            transition: all 0.2s;
            cursor: pointer;
        }

        .element-btn:active { transform: scale(0.9); }

        .active-element {
            background: rgba(138, 43, 226, 0.5) !important;
            border: 1px solid var(--accent-cyan) !important;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
        }

        #particles-background {
            position: fixed;
            top: 0; left: 0; z-index: -1;
        }

        .bpm-pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(.8); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(.8); opacity: 0.8; }
        }

        /* Ocultar barra de scroll pero mantener funcionalidad */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

    </style>
</head>
<body>

    <div id="particles-background"></div>

    <div id="amari-assistant">
        <div class="amari-window">
            <img src="imagen/Recepcion.png" id="amari-mini-img" alt="Amari">
            <div class="amari-bubble" id="amari-mini-speech">
                ✨ Estoy aquí contigo ✨
            </div>
            <div class="flex justify-around mt-2">
                <button onclick="changeAmari('Casual.png', '¿Cómo fluyes?')" class="text-[10px] text-cyan-400"><i class="fas fa-magic"></i></button>
                <button onclick="changeAmari('Pensando.png', 'Analizando...')" class="text-[10px] text-purple-400"><i class="fas fa-brain"></i></button>
                <button onclick="scrollToTop()" class="text-[10px] text-white"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <nav class="fixed top-0 left-0 right-0 z-[5000] p-4">
        <div class="glass-card flex justify-between items-center p-4 m-0">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></div>
                <h1 class="serif-text text-lg font-bold glow-text tracking-tighter">ECOS DE RAÍZ</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="toggleFS()" class="text-white opacity-70"><i class="fas fa-expand"></i></button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-24 pb-32">
        
        <section class="glass-card p-6 mb-12">
            <h2 class="serif-text text-2xl text-center mb-6">Tu Mapa Sensorial</h2>
            <div class="relative max-w-md mx-auto">
                <svg viewBox="0 0 400 300" class="w-full h-auto drop-shadow-2xl" id="brain-svg">
                    <path d="M150,80 Q200,40 250,80 Q280,100 260,140 Q280,180 240,200 Q200,230 160,200 Q120,180 140,140 Q120,100 150,80" 
                          fill="rgba(138, 43, 226, 0.1)" stroke="rgba(138, 43, 226, 0.3)" stroke-width="2"/>
                    
                    <path id="reg-art" class="brain-region" d="M180,120 L220,120" stroke="#8A2BE2" stroke-width="12" stroke-linecap="round" onclick="navTo('art-module')"/>
                    <circle id="reg-music" class="brain-region" cx="200" cy="90" r="25" fill="none" stroke="#00FFFF" stroke-width="4" onclick="navTo('music-module')"/>
                    <path id="reg-dance" class="brain-region" d="M180,170 Q200,190 220,170" stroke="#FF7F50" stroke-width="6" fill="none" onclick="navTo('dance-module')"/>
                    <circle id="reg-mem" class="brain-region" cx="150" cy="150" r="10" fill="#50C878" onclick="navTo('closure-module')"/>
                    <path id="reg-lang" class="brain-region" d="M250,130 L270,150" stroke="#FFD700" stroke-width="8" stroke-linecap="round" onclick="navTo('art-module')"/>

                    <text x="180" y="80" fill="#00FFFF" class="text-[12px] serif-text">VISIÓN</text>
                    <text x="230" y="190" fill="#FF7F50" class="text-[12px] serif-text">RITMO</text>
                </svg>
            </div>
            <p class="text-center text-xs opacity-50 mt-4">Toca un área para viajar por tu interior</p>
        </section>

        <section id="music-module" class="glass-card p-6">
            <h2 class="serif-text text-3xl mb-6 flex items-center">
                <i class="fas fa-adjust mr-3 text-cyan-400"></i> Alquimia Sonora
            </h2>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button class="element-btn p-5 glass-card flex flex-col items-center" data-freq="174" data-color="#4B0082">
                    <i class="fas fa-mountain mb-2 text-amber-800"></i><span class="text-xs">174Hz - Base</span>
                </button>
                <button class="element-btn p-5 glass-card flex flex-col items-center" data-freq="417" data-color="#00FFFF">
                    <i class="fas fa-water mb-2 text-blue-400"></i><span class="text-xs">417Hz - Cambio</span>
                </button>
                <button class="element-btn p-5 glass-card flex flex-col items-center" data-freq="528" data-color="#8A2BE2">
                    <i class="fas fa-heart mb-2 text-pink-500"></i><span class="text-xs">528Hz - ADN</span>
                </button>
                <button class="element-btn p-5 glass-card flex flex-col items-center" data-freq="852" data-color="#FFD700">
                    <i class="fas fa-eye mb-2 text-yellow-400"></i><span class="text-xs">852Hz - Luz</span>
                </button>
            </div>
            <div class="p-4 bg-black/40 rounded-3xl border border-white/5">
                <canvas id="freq-canvas" class="w-full h-32"></canvas>
            </div>
        </section>

        <section id="art-module" class="glass-card p-6 mt-12">
            <h2 class="serif-text text-3xl mb-6 flex items-center">
                <i class="fas fa-paint-brush mr-3 text-purple-400"></i>Lienzo Vital
            </h2>
            <div class="mb-6">
                <button id="btn-upload" class="w-full p-4 glass-card border-dashed border-2 border-purple-500/50 flex justify-center items-center gap-3">
                    <i class="fas fa-cloud-upload-alt text-xl"></i> PROYECTAR IMAGEN
                </button>
                <input type="file" id="inp-img" class="hidden" accept="image/*">
            </div>

            <div id="p5-canvas-container" class="w-full aspect-video rounded-3xl overflow-hidden shadow-2xl bg-black/30 border border-white/10"></div>

            <div class="grid grid-cols-4 gap-2 mt-4">
                <button class="brush-btn p-3 glass-card" data-type="circle"><i class="fas fa-circle"></i></button>
                <button class="brush-btn p-3 glass-card" data-type="flower"><i class="fas fa-spa"></i></button>
                <button class="brush-btn p-3 glass-card" data-type="star"><i class="fas fa-bolt"></i></button>
                <button onclick="clearCanvas()" class="brush-btn p-3 glass-card text-red-400"><i class="fas fa-trash"></i></button>
            </div>
            
            <div class="mt-6 space-y-4">
                <div>
                    <label class="text-[10px] uppercase tracking-widest opacity-60">Energía Vital (Brillo)</label>
                    <input type="range" id="filter-bright" class="w-full accent-purple-500" min="0" max="200" value="100">
                </div>
                <button onclick="saveArt()" class="w-full p-4 glass-card bg-white/5 font-bold uppercase text-xs tracking-widest">Descargar Manifiesto Visual</button>
            </div>
        </section>

        <section id="dance-module" class="glass-card p-10 mt-12 text-center">
            <h2 class="serif-text text-3xl mb-8">El Ritmo del Corazón</h2>
            <div class="relative inline-block">
                <div class="bpm-pulse absolute inset-0 bg-purple-500/20 rounded-full"></div>
                <div class="w-32 h-32 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-full flex items-center justify-center shadow-2xl relative z-10">
                    <i class="fas fa-heartbeat text-5xl text-white"></i>
                </div>
            </div>
            <div class="mt-8">
                <div class="text-4xl font-bold tracking-tighter" id="val-bpm">60</div>
                <div class="text-[10px] uppercase tracking-widest opacity-50">Latidos por Minuto</div>
            </div>
            <div class="mt-6 flex gap-2 justify-center">
                <button onclick="adjBPM(-5)" class="p-3 glass-card">-</button>
                <button onclick="adjBPM(5)" class="p-3 glass-card">+</button>
            </div>
        </section>

        <section id="closure-module" class="glass-card p-6 mt-12 mb-20 bg-gradient-to-b from-transparent to-purple-900/20">
            <h2 class="serif-text text-3xl mb-6 text-center">Tu Carta de Integración</h2>
            <div class="p-8 border-2 border-cyan-500/30 rounded-3xl text-center italic relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl"><i class="fas fa-quote-right"></i></div>
                <p id="oracle-text" class="text-lg serif-text leading-relaxed">
                    "Que tu raíz sea tan profunda como tu deseo de volar. Hoy has transformado tu frecuencia en luz."
                </p>
            </div>
            <button onclick="generateOracle()" class="w-full mt-6 p-4 glass-card border-cyan-400/50 hover:bg-cyan-400/10 transition-all">
                <i class="fas fa-sync-alt mr-2"></i> RECIBIR NUEVO MENSAJE
            </button>
        </section>

    </main>

    <script>
        /* ==========================================
           1. LOGICA DE AUDIO AVANZADA
        ========================================== */
        let audioCtx, mainGain, currentOsc;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mainGain = audioCtx.createGain();
                mainGain.connect(audioCtx.destination);
                mainGain.gain.value = 0.5;
            }
        }

        document.querySelectorAll('.element-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                initAudio();
                const freq = this.dataset.freq;
                const color = this.dataset.color;

                if (currentOsc) {
                    currentOsc.stop();
                    document.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active-element'));
                    if (currentOsc.freqVal == freq) { currentOsc = null; return; }
                }

                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.freqVal = freq;

                g.gain.setValueAtTime(0, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.5);

                osc.connect(g);
                g.connect(mainGain);
                osc.start();
                currentOsc = osc;
                this.classList.add('active-element');
                changeAmari('Casual.png', `Resonando en ${freq}Hz`);
            });
        });

        /* ==========================================
           2. VISUALIZADOR DE FRECUENCIA
        ========================================== */
        const fCanv = document.getElementById('freq-canvas');
        const fCtx = fCanv.getContext('2d');
        fCanv.width = 800; fCanv.height = 200;

        function drawFreq() {
            fCtx.clearRect(0, 0, fCanv.width, fCanv.height);
            fCtx.beginPath();
            fCtx.strokeStyle = '#00FFFF';
            fCtx.lineWidth = 4;
            fCtx.lineJoin = 'round';

            for (let i = 0; i < fCanv.width; i++) {
                const amp = currentOsc ? 60 : 5;
                const speed = Date.now() * 0.005;
                const y = 100 + Math.sin(i * 0.02 + speed) * amp;
                if (i === 0) fCtx.moveTo(i, y);
                else fCtx.lineTo(i, y);
            }
            fCtx.stroke();
            requestAnimationFrame(drawFreq);
        }
        drawFreq();

        /* ==========================================
           3. AMARI ASISTENTE Y NAVEGACIÓN
        ========================================== */
        function changeAmari(img, text) {
            const miniImg = document.getElementById('amari-mini-img');
            const speech = document.getElementById('amari-mini-speech');
            
            gsap.to([miniImg, speech], { opacity: 0, scale: 0.8, duration: 0.2, onComplete: () => {
                miniImg.src = "imagen/" + img;
                speech.innerText = text;
                gsap.to([miniImg, speech], { opacity: 1, scale: 1, duration: 0.4, ease: "back.out" });
            }});
        }

        function navTo(id) {
            gsap.to(window, { duration: 1, scrollTo: "#" + id, ease: "power4.inOut" });
            changeAmari('Caminando1.png', '¡Vamos allá!');
        }

        function scrollToTop() {
            gsap.to(window, { duration: 1, scrollTo: 0, ease: "power4.inOut" });
        }

        /* ==========================================
           4. SISTEMA DE ARTE P5.JS (FULL)
        ========================================== */
        let myP5 = new p5((p) => {
            let userImg = null;
            let brushType = 'circle';

            p.setup = () => {
                let cnv = p.createCanvas(800, 450);
                cnv.parent('p5-canvas-container');
                p.background(10, 5, 20);
            };

            p.draw = () => {
                let b = document.getElementById('filter-bright').value;
                p.tint(b, b, b); 
                if (userImg) p.image(userImg, 0, 0, p.width, p.height);
            };

            p.mouseDragged = () => {
                if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height) {
                    p.noStroke();
                    p.fill(138, 43, 226, 150);
                    if (brushType === 'circle') p.ellipse(p.mouseX, p.mouseY, 30);
                    if (brushType === 'flower') {
                        p.fill(0, 255, 255, 100);
                        p.text('🌸', p.mouseX, p.mouseY);
                    }
                    if (brushType === 'star') p.text('✨', p.mouseX, p.mouseY);
                }
            };

            window.loadImg = (url) => {
                userImg = p.loadImage(url);
                changeAmari('Casual.png', '¡Qué bella imagen!');
            };

            window.clearCanvas = () => {
                p.background(10, 5, 20);
                userImg = null;
            };

            window.saveArt = () => p.saveCanvas('mi_alquimia_ecos', 'png');

            document.querySelectorAll('.brush-btn').forEach(btn => {
                btn.onclick = () => {
                    brushType = btn.dataset.type;
                    document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active-element'));
                    btn.classList.add('active-element');
                }
            });
        });

        document.getElementById('btn-upload').onclick = () => document.getElementById('inp-img').click();
        document.getElementById('inp-img').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => window.loadImg(ev.target.result);
            reader.readAsDataURL(file);
        };

        /* ==========================================
           5. RITMO Y ORÁCULO
        ========================================== */
        let bpm = 60;
        function adjBPM(v) {
            bpm += v;
            if (bpm < 40) bpm = 40;
            if (bpm > 180) bpm = 180;
            document.getElementById('val-bpm').innerText = bpm;
            updatePulse();
        }

        function updatePulse() {
            gsap.killTweensOf(".bpm-pulse");
            gsap.to(".bpm-pulse", {
                scale: 1.5, opacity: 0, 
                duration: 60/bpm, 
                repeat: -1, 
                ease: "sine.out"
            });
        }
        updatePulse();

        const phrases = [
            "Tu vibración está alineada con el universo.",
            "El silencio es el lienzo donde pintas tu paz.",
            "Cada movimiento tuyo es una oración sin palabras.",
            "Confía en el ritmo de tu propia raíz.",
            "Hoy has transformado el ruido en ecos de luz."
        ];

        function generateOracle() {
            const txt = phrases[Math.floor(Math.random() * phrases.length)];
            document.getElementById('oracle-text').innerText = txt;
            changeAmari('Casual.png', 'Un mensaje para ti');
        }

        /* ==========================================
           6. FONDO DE PARTÍCULAS
        ========================================== */
        new p5((p) => {
            let pts = [];
            p.setup = () => {
                p.createCanvas(p.windowWidth, p.windowHeight).parent('particles-background');
                for(let i=0; i<60; i++) pts.push({x: p.random(p.width), y: p.random(p.height), s: p.random(1,3)});
            };
            p.draw = () => {
                p.clear();
                p.fill(138, 43, 226, 100);
                pts.forEach(pt => {
                    p.ellipse(pt.x, pt.y, pt.s);
                    pt.y -= 0.5;
                    if (pt.y < 0) pt.y = p.height;
                });
            };
        });

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }
    </script>
</body>
</html>
